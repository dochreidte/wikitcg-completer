# =====================================================================
#  wikitcg-completer — configuration
#  Copy this file to  config.toml  and fill in at least
#  api.session_cookie.
# =====================================================================

[api]
base_url = "https://wikitcg.net"
# Value of the wtcg_session cookie (the JWT read from your browser).
session_cookie = "PASTE_YOUR_wtcg_session_JWT_HERE"
# Optional EXTRA cookies, header format: "name1=val1; name2=val2".
# Useful if the site requires e.g. a Cloudflare cf_clearance cookie.
# ⚠️ cf_clearance is tied to your User-Agent: keep the same UA as your browser.
extra_cookies = ""
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:151.0) Gecko/20100101 Firefox/151.0"
http2 = true

[throttle]
# Reads (GET, sync): short delay -> sync stays fast.
read_interval = 0.4
read_jitter = 0.6
# Actions (POST: open/recycle/trade): MINIMAL delay + jitter.
min_interval = 2.0
jitter = 2.5
# Longer pause every N booster opens (anti-429 on bursts).
cooldown_every = 8
cooldown_seconds = 25.0
cooldown_jitter = 15.0

[retry]
max_retries = 5
backoff_base = 2.0      # delay = backoff_base ** attempt
backoff_cap = 120.0     # cap in seconds
backoff_jitter = 0.5    # fraction of random jitter (0..1)

[engine]
auto_open = true
auto_recycle = true
# Load the full catalog (missing cards / marketplace). Set false for an even faster
# sync if you only open + recycle.
fetch_catalog = true
# Resync /status every N actions (tracks ink / free packs / regen).
resync_every = 5
# Automatically buy a restock with ink when free packs are exhausted
# (recycle duplicates first if ink is short). Also changeable from the UI.
buy_packs_with_ink = true
# Ink to keep in reserve (don't go below it when buying packs).
min_ink_reserve = 0
# Recycling: "surplus" (drain the surplus, max ink) | "on_demand" (fund restocks at the
# minimum, preserving rare cards for trading).
recycle_mode = "surplus"
# Duplicate reserve: "fixed" = keep_spares (below) | "missing" = keep as many duplicates as
# MISSING cards per rarity (15 duplicate LR, 3 missing -> recycle 12).
recycle_reserve_mode = "fixed"
# Recycle order by rarity: "common_first" (preserves rare cards for trading) |
# "rare_first" (PURE FARM: recycle the rarest first -> max ink under the ~200/day quota).
recycle_priority = "common_first"
# "mystery" pack (premium): open it as soon as it's available (~1x/6h). Opens like a normal pack.
mystery_pack = true
mystery_interval_hours = 6.0
# Start the loop automatically when the server launches.
autostart = false
# Light ink/packs re-sync every N s (know the real numbers + detect regen).
status_sync_seconds = 15.0
# Cadences (s) of the recycle / marketplace tasks (DEFERRED while packs remain to open).
recycle_interval = 30.0
marketplace_interval = 45.0
# GUARANTEED marketplace cadence (s): forces a pass even if packs remain to open
# (otherwise, with buying packs with ink, opening never stops and the marketplace is ignored).
marketplace_min_interval = 120.0
# Card that returns 500 on recycling: base delay (minutes), growing on each failure.
recycle_retry_minutes = 30.0
# DAILY recycle quota (~200/day): on 429, pause recycling for N min
# (opening continues) then retry. Avoids hammering /api/cards/recycle in a loop.
recycle_quota_cooldown_minutes = 60.0
# Periodic full re-sync (minutes); 0 = off. Useful if you also play in the browser.
full_resync_minutes = 0.0
# Marketplace backoff when there's nothing to do: cap (s).
marketplace_interval_max = 900.0
# Packs exhausted: "wait" (wait for regen) | "stop". The wait aligns on nextRegenAt;
# otherwise a growing backoff capped by idle_poll_max.
on_empty = "wait"
idle_poll_seconds = 60.0
idle_poll_max = 1800.0
# Rarities to NEVER recycle (kept entirely). E.g. ["LR"] or ["LR", "UR"].
recycle_skip_rarities = []

# Recycle policy: number of DUPLICATES kept as trade material (phase 2).
# Recyclable surplus of a card = quantity - 1 (the collection copy) - keep_spares[rarity].
# C cards are never offered in trades -> keep_spares C = 0 (all surplus is recycled).
[engine.keep_spares]
C = 0
UC = 1
R = 1
SR = 1
SSR = 1
UR = 2
LR = 2

[packs]
# Buying packs with ink (phase 2). 400 ink = full restock of 5 packs.
full_restock_ink = 400
max_free_packs = 5

[marketplace]
# Phase 2 — acts on REAL players and commits your cards: opt-in.
enabled = false
# Always keep this many active listings (fills the free slots).
max_listings = 5
# Also fulfill other players' listings that offer one of my missing cards.
fulfill_others = false
fulfill_per_pass = 3
# Prioritize series close to completion (few cards remaining).
prefer_near_completion = true
# Dry-run: simulate (log) without writing — to validate before committing real cards.
dry_run = false
# Active listing older than this -> cancelled then recreated fresh. 0 = never.
max_listing_age_hours = 24.0
# Focus: target ONLY series missing <= N cards (close to the end). 0 = all.
near_completion_max_missing = 0

[recycle]
# Global endpoint that lists your DUPLICATES (with hex copy id) — returns a limited batch
# per call; the engine calls it again in a loop as recycling progresses.
duplicates_endpoint = "/api/cards/duplicates"
# Max copies recycled per call (anti-429 + the endpoint already limits the batch).
max_per_call = 20
# Tolerant parsing: leave empty for auto-detection. Adjust if needed once
# a sample /api/cards/duplicates response is known.
list_key = ""           # key of the array in the response (e.g. "duplicates" / "cards"), empty = auto
id_field = ""           # field of the hex copy id, empty = auto
type_field = ""         # field of the "wiki-..." type, empty = auto
quantity_field = ""     # field of the total copy count if present, empty = auto

# Recycle values per rarity (ink). LR/UR/SSR/SR known; R/UC/C learned
# empirically (left at 0 = unknown, filled in from observed responses).
[recycle.values]
LR = 500
UR = 250
SSR = 100
SR = 40
R = 0
UC = 0
C = 0

[server]
host = "127.0.0.1"
port = 8765

[paths]
database = "wikitcg.db"
log_file = "wikitcg.log"

[logging]
# Global level: "DEBUG" (everything), "INFO" (default), "WARNING", "ERROR".
level = "INFO"
# true = trace EVERY API request (method, route, status, duration) — useful for diagnosing.
log_requests = false
