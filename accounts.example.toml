# =====================================================================
#  wikitcg-completer — accounts for the MULTI-ACCOUNT farm (run_multi.py)
#  Copy this file to  accounts.toml  and fill in your accounts.
#
#  Principle: each account opens ONE single series and recycles its duplicates to
#  re-buy packs. We exploit an account to the fullest then switch to the next one
#  when it has nothing left to do (no free packs, not enough ink, recycling capped
#  by the daily quota ~200/day). We loop indefinitely.
#
#  The COMMON settings (throttle, retry, recycle values, keep_spares,
#  recycle_reserve_mode, recycle_quota_cooldown_minutes...) come from config.toml.
#  ⚠️ This file contains secrets (cookies): it is gitignored.
# =====================================================================

[runner]
# Active-account polling cadence (s): we switch as soon as it goes to waiting.
poll_seconds = 8.0
# When ALL accounts are exhausted on a pass, wait before starting again (minutes).
# Gives time for free packs to regenerate / the recycle quota to reset.
idle_cycle_minutes = 30.0
# Web monitoring page (read-only): open http://127.0.0.1:8766 while it runs.
web = true
web_host = "127.0.0.1"
web_port = 8766

# --- One [[account]] block per account. Duplicate it as many times as needed. ---
[[account]]
name = "account1"                      # free label (used for the database filename: wikitcg_account1.db)
series = "myths-legends"               # SLUG of the series to farm (e.g. space-cosmos, ancient-civilizations...)
session_cookie = "PASTE_YOUR_wtcg_session_JWT_HERE"
extra_cookies = "cf_clearance=PASTE_cf_clearance_HERE"   # same User-Agent as config.toml
# mystery = false                      # (optional) also open the mystery pack (separate pool) — default false

[[account]]
name = "account2"
series = "space-cosmos"
session_cookie = "PASTE_YOUR_wtcg_session_JWT_HERE"
extra_cookies = "cf_clearance=PASTE_cf_clearance_HERE"
